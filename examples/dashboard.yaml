# Paste this as a manual card and replace the halo_charger entity IDs with
# those from your charger. All cards below are built into Home Assistant.
type: vertical-stack
cards:
  - type: entities
    title: EV charging
    show_header_toggle: false
    entities:
      - entity: sensor.halo_charger_status_connector
        name: Charger status
      - entity: sensor.halo_charger_power_active_import
        name: Charging power
      - entity: sensor.halo_charger_energy_session
        name: Current session
      - entity: number.halo_charger_maximum_current
        name: Maximum current
      - entity: binary_sensor.halo_charger_charge_control_schedule_active
        name: Elpris schedule
      - entity: sensor.halo_charger_charge_control_scheduled_start
        name: Scheduled start
      - entity: sensor.halo_charger_charge_control_scheduled_end
        name: Scheduled end
      - type: divider
      - entity: button.halo_charger_charge_control_start_charging
        name: Start now
      - entity: button.halo_charger_charge_control_stop_charging
        name: Stop
      - entity: button.halo_charger_charge_control_cancel_schedule
        name: Cancel schedule

  - type: statistics-graph
    title: Charging this month
    chart_type: bar
    period: day
    days_to_show: 31
    stat_types:
      - change
    entities:
      - entity: sensor.halo_charger_energy_active_import_register
        name: Charged energy

  - type: statistics-graph
    title: Charging by month
    chart_type: bar
    period: month
    days_to_show: 365
    stat_types:
      - change
    entities:
      - entity: sensor.halo_charger_energy_active_import_register
        name: Charged energy
